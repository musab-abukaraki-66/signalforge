[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge"
version = "0.1.0"
description = "SIGNALFORGE: from raw data to better decisions. E-commerce data engineering, analytics, ML and decision support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Musab AbuKaraki" }]
keywords = ["data-engineering", "analytics", "business-intelligence", "decision-intelligence", "duckdb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
# Runtime dependencies are limited to what the code actually imports.
dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Added when the milestone that needs them begins (see docs/ROADMAP.md).
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
mlflow = ["mlflow>=2.12"]  # optional, not used by the MVP
dev = ["pytest>=8.0", "ruff>=0.6", "streamlit>=1.35", "plotly>=5.20"]

[project.scripts]
signalforge = "signalforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: Filters/TrainSettings are frozen dataclasses, so they are safe as defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings and dense UI/generator code stay readable on one line.
"tests/**" = ["E501"]
"src/signalforge/analytics/*.py" = ["E501"]
"src/signalforge/quality/checks.py" = ["E501"]
"src/signalforge/dashboard/app.py" = ["E501"]
"src/signalforge/demo/synthetic.py" = ["E501"]
"src/signalforge/models/late_delivery.py" = ["E501"]
